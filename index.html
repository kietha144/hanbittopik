<style>
:root{color-scheme:light;--bg:#fff5f9;--card:#fff;--ink:#3a1830;--mute:#8a6a7e;--p:#ff4f9a;--p2:#ff8cc0;--soft:#ffe1ef;--ok:#14b87a;--no:#f0476b;--line:#ffd3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#24101c;--card:#33192a;--ink:#ffeaf4;--mute:#d3a5bf;--soft:#4a2038;--line:#5a2c47}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#24101c;--card:#33192a;--ink:#ffeaf4;--mute:#d3a5bf;--soft:#4a2038;--line:#5a2c47}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;min-height:100vh}
.kr{font-family:"Noto Sans KR","Be Vietnam Pro",sans-serif}
.app{max-width:560px;margin:0 auto;padding:18px 16px 170px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}h1 span{color:var(--p)}
.chip{background:var(--soft);color:var(--p);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.lv{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.lv button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.lv button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(255,79,154,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#ff4f9a,#ff9ccb);color:#fff;border:0;box-shadow:0 12px 28px rgba(255,79,154,.3)}
.hero h2{margin:0 0 4px;font-size:20px;font-weight:800}.hero p{margin:0 0 14px;opacity:.95}
.bar{height:10px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--p)}.stat small{color:var(--mute)}
.btn{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--p);color:#fff}
.btn.alt{background:var(--soft);color:var(--p)}.btn.w{background:#fff;color:var(--p)}.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}
.row{display:flex;gap:10px}.row>*{flex:1}
.flash{perspective:900px;height:230px;margin-bottom:14px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.f .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1.5px solid var(--line);padding:16px}
.face.b{transform:rotateY(180deg);background:linear-gradient(135deg,var(--soft),var(--card))}
.big{font-size:44px;font-weight:700;color:var(--p)}.mean{font-size:26px;font-weight:800}
.hint{color:var(--mute);font-size:13px}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;font:inherit;font-weight:600;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.q{font-size:34px;text-align:center;font-weight:700;margin:10px 0 18px;color:var(--p)}
.g h3{margin:0 0 4px;font-size:18px;color:var(--p)}.g p{margin:2px 0}.ex{background:var(--soft);border-radius:12px;padding:9px 12px;margin-top:8px}
.hg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hg button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 0;cursor:pointer;font:inherit}
.hg b{display:block;font-size:26px;color:var(--p)}.hg small{color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;font-weight:600;padding:6px 0;cursor:pointer;border-radius:12px}
nav button.on{color:var(--p);background:var(--soft)}nav button span{display:block;font-size:20px}
button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.flash{height:270px}
#cat{position:fixed;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:64px;z-index:5;cursor:grab;touch-action:none;user-select:none}#cat:active{cursor:grabbing}#cat svg{display:block}#cat.dn #cb{bottom:auto;top:100%;margin:4px 0 0}#cat.lf #cb{right:auto;left:0}
#cb{display:none;position:absolute;right:0;bottom:100%;margin-bottom:4px;width:max-content;max-width:min(240px,70vw);background:var(--card);color:var(--ink);border:1.5px solid var(--p2);border-radius:16px 16px 4px 16px;padding:9px 12px;font-size:13px;box-shadow:0 6px 18px rgba(255,79,154,.25)}
#cat svg{filter:drop-shadow(0 4px 6px rgba(255,79,154,.35))}
.ring{flex:none;width:112px;height:112px;border-radius:50%;background:conic-gradient(#fff calc(var(--v)*1%),rgba(255,255,255,.3) 0);display:grid;place-items:center}.ring b{width:86px;height:86px;border-radius:50%;background:#ff5fa5;display:grid;place-items:center;font-size:28px}
.wk{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:10px}.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;text-align:center}.wk i{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:linear-gradient(var(--p),var(--p2))}.wk small{font-size:11px;color:var(--mute)}
.sec{margin:18px 0 10px;font-size:16px;color:var(--p)}
.deck{cursor:pointer;margin:0;display:flex;flex-direction:column;gap:6px}.deck b{font-size:14px}
.pb{background:var(--soft)}.pb i{background:var(--p)}
.mode{display:flex;gap:14px;align-items:center;cursor:pointer}.ic{font-size:26px;flex:none;width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center}
.inp{display:block;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;font-size:18px;margin-bottom:8px}
.opt.sel{border-color:var(--p);background:var(--soft)}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
.gi{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}select.opt{margin-bottom:0}
</style></head><body>

const P53=['<p class="kr" style="font-weight:700">대학생의 하루 스마트폰 사용 시간</p><p class="hint">Dữ liệu minh họa: 2015: 2,1 giờ · 2020: 3,4 giờ · 2025: 4,2 giờ. Lý do tăng: học trực tuyến 45%, mạng xã hội 35%, giải trí 20%.<br>Yêu cầu: ① mô tả sự thay đổi theo thời gian ② nêu lý do thời gian sử dụng tăng.</p>','<p class="kr" style="font-weight:700">출근 교통수단 조사 결과</p><p class="hint">Dữ liệu minh họa: tàu điện ngầm 42% · xe buýt 31% · xe cá nhân 18% · khác 9%.<br>Yêu cầu: ① so sánh tỷ lệ các phương tiện ② nhận xét xu hướng.</p>'];

function mkEx(id,short){const E=EX[id],pw=ALL.filter(w=>E.lv.includes(w[5])),pwA=pw.filter(w=>w[3].includes(w[0])),pg=ALLG.filter(g=>E.lv.includes(g[4])),used=new Set(),pk=a=>a[Math.floor(Math.random()*a.length)];

LB:()=>{const w=wp();return{say:w[3],stem:"Nghe câu và chọn bản dịch đúng.",...op(w,pw,x=>x[4]),wk:["w",w[0]],rv:w[3]+" = "+w[4]}},
RA:()=>{const w=wp(pwA);return{stem:st(w[3].replace(w[0],"(      )"))+`<p class="hint" style="text-align:center">${w[4]}</p><p>Chọn từ điền vào chỗ trống.</p>`,kr:1,...op(w,pw,x=>x[0]),wk:["w",w[0]],rv:w[3]}},
RB:()=>{const g=pk(pg);return{stem:st(g[2])+"<p>Câu này dùng mẫu ngữ pháp nào?</p>",kr:1,...op(g,pg,x=>x[0]),wk:["g",g[0]],rv:g[2]+" → "+g[0]}},
RC:()=>{const w=wp();return{stem:st(w[3])+`<p>Từ <b class="kr">${w[0]}</b> trong câu có nghĩa là gì?</p>`,...op(w,pw,x=>x[1]),wk:["w",w[0]],rv:w[0]+" = "+w[1]}},
RD:()=>{const w=wp();return{stem:st(w[3])+"<p>Chọn bản dịch đúng.</p>",...op(w,pw,x=>x[4]),wk:["w",w[0]],rv:w[3]+" = "+w[4]}},
RE:()=>{const g=pk(pg);return{stem:st(g[0])+"<p>Mẫu ngữ pháp này có nghĩa là gì?</p>",...op(g,pg,x=>x[1]),wk:["g",g[0]],rv:g[0]+" = "+g[1]}}};
const mix=(sec,n)=>{const m=sec=="L"?[["LA",.4],["LB",.6]]:[["RA",.3],["RB",.2],["RC",.15],["RD",.2],["RE",.15]];const a=[];m.forEach(([k,p])=>{for(let i=0;i<Math.round(n*p);i++)a.push(k)});while(a.length<n)a.push(m[0][0]);return a.slice(0,n).map(k=>({...T[k](),ty:k}))};
const qn=s=>short?Math.ceil(E[s].q/3):E[s].q;
X={id,short,name:E.n,order:E.order,si:0,qi:0,qs:{L:mix("L",qn("L")),R:mix("R",qn("R"))},ans:{L:{},R:{}},pl:{},ws:{a:[0,0,0],b:[0,0,0]}};
if(id==2)X.W={f:[0,1].map(()=>{const w=wp(pwA);return{s:w[3].replace(w[0],"(      )"),v:w[4],a:w[0],r:w[2]}}),p53:pk(P53),p54:pk(P54)}}
function exv(){stopT();X=null;
$("m").innerHTML=`<button class="btn alt" onclick="practice()">← Luyện tập</button><div class="card" style="margin-top:12px"><b>Thi thử TOPIK</b><p class="hint" style="margin:6px 0 0">Mô phỏng cấu trúc đề thi thật: bấm giờ từng phần, không quay lại phần đã nộp, phần nghe chỉ nghe tối đa 2 lần mỗi câu. Câu hỏi do app tự tạo từ kho từ vựng và ngữ pháp, không phải đề thi thật và chưa có bài đọc dài. Cần giọng tiếng Hàn trên máy để làm phần nghe.</p></div>`+[1,2].map(id=>`<div class="card"><b>${EX[id].n}</b> <span class="chip">${EX[id].pts} điểm</span><p class="hint">${EX[id].desc}</p><div class="row"><button class="btn" onclick="exstart(${id},0)">Thi đầy đủ</button><button class="btn alt" onclick="exstart(${id},1)">Rút gọn (1/3)</button></div></div>`).join("")}

function wcnt(){[["53",200,300],["54",600,700]].forEach(([k,a,b])=>{$("c"+k).textContent=$("w"+k).value.length+" chữ (yêu cầu "+a+" đến "+b+")"})}
function exw(){const W=X.W;$("m").innerHTML=exh("W")+`<div class="card"><b>Câu 51–52 · Điền vào chỗ trống (mỗi câu 10 điểm)</b><p class="hint">Gõ từ còn thiếu bằng Hangul (hoặc phiên âm Latin).</p>${W.f.map((x,k)=>`<p class="kr" style="font-weight:700;margin-bottom:2px">${x.s}</p><p class="hint" style="margin:0 0 6px">${x.v}</p><input class="inp kr" id="wf${k}" autocomplete="off">`).join("")}</div><div class="card"><b>Câu 53 · Viết đoạn miêu tả biểu đồ (30 điểm, 200–300 chữ)</b>${W.p53}<textarea class="inp kr" id="w53" rows="8" oninput="wcnt()"></textarea><small class="hint" id="c53"></small></div><div class="card"><b>Câu 54 · Viết bài luận (50 điểm, 600–700 chữ)</b>${W.p54}<textarea class="inp kr" id="w54" rows="14" oninput="wcnt()"></textarea><small class="hint" id="c54"></small></div><button class="btn" style="width:100%" onclick="exs2(this)">Nộp phần viết</button>`;wcnt();tick()}
function exs2(b){if(!b.dataset.c){const s=X.order[X.si],n=s=="W"?0:X.qs[s].length-Object.keys(X.ans[s]).length;b.dataset.c=1;b.textContent="Bấm lại để nộp"+(n?" (còn "+n+" câu chưa làm)":"");return}subm()}

function exfin(){const sc={},wr=[],ty={};["L","R"].forEach(s=>{let c=0;X.qs[s].forEach((q,i)=>{const ok0=X.ans[s][i]==q.a;ty[q.ty]=ty[q.ty]||[0,0];ty[q.ty][1]++;if(ok0)ty[q.ty][0]++;if(ok0)c++;else{if(q.wk)addW(q.wk[0],q.wk[1]);wr.push([s,i,q])}});sc[s]=Math.round(c/X.qs[s].length*100)});X.sc=sc;X.wr=wr;X.hi={d:Date.now(),id:X.id,short:X.short?1:0,L:sc.L,R:sc.R,t:sc.L+sc.R,ty:ty};S.exh=S.exh||[];S.exh.push(X.hi);save();
if(X.W){const n=x=>(x||"").toLowerCase().replace(/[\s.,!?]/g,"");X.wauto=X.W.f.reduce((a,f,k)=>{const v=n((X.wf||[])[k]);return a+(v&&(v==n(f.a)||v==n(f.r))?10:0)},0)}}

function exres(){const E=EX[X.id],t=X.sc.L+X.sc.R+(X.W?wtot():0),lv=[...E.cut].reverse().find(c=>t>=c[0]);
const sel=(g,k,mx)=>`<select class="opt" style="padding:8px;margin:0;width:auto" onchange="X.ws.${g}[${k}]=+this.value;exres()">${Array.from({length:mx+1},(_,v)=>`<option ${X.ws[g][k]==v?"selected":""}>${v}</option>`).join("")}</select>`;
const rub=(g,nm,mx)=>nm.map((x,k)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0"><span>${x} (tối đa ${mx[k]})</span>${sel(g,k,mx[k])}</div>`).join("");
const nm=["Nội dung và thực hiện yêu cầu","Cấu trúc bài viết","Sử dụng ngôn ngữ"];
X.hi.t=t;if(X.W)X.hi.W=wtot();save();$("m").innerHTML=`<div class="card hero" style="text-align:center"><h2>${t}/${E.pts} điểm (ước tính)</h2><p style="margin:0">${lv?"Mức đạt: "+lv[1]:"Chưa đạt mức thấp nhất ("+E.cut[0][0]+" điểm)"}</p></div>
<div class="card"><b>Điểm từng phần</b><p class="hint" style="margin:6px 0 0">Nghe: ${X.sc.L}/100 · Đọc: ${X.sc.R}/100${X.W?" · Viết: "+wtot()+"/100 (gồm phần tự chấm bên dưới)":""}<br>${X.short?"Bản rút gọn: điểm quy đổi theo tỷ lệ câu đúng, chỉ để tham khảo. ":""}Đề thật chấm mỗi câu 2 đến 4 điểm tùy độ khó, nên điểm ở đây chỉ là ước tính.</p></div>`+(X.W?`<div class="card"><b>Phần viết</b><p class="hint">Điền chỗ trống: ${X.W.f.map((f,k)=>"đáp án "+f.a+", bạn gõ: "+((X.wf||[])[k]||"(trống)")).join(" · ")} (đúng ${(X.wauto||0)/10}/2).<br>Câu 53 và 54 hãy tự chấm theo tiêu chí của đề thật. Lưu ý văn viết dùng đuôi -ㄴ/는다, không dùng -요 hoặc -습니다.</p><b>Câu 53 (${X.t53.length} chữ)</b>${rub("a",nm,[7,7,16])}<b>Câu 54 (${X.t54.length} chữ)</b>${rub("b",nm,[12,12,26])}</div>`:"")+`<div class="card"><b>Câu làm sai (${X.wr.length})</b><p class="hint" style="margin:6px 0 0">Đã lưu vào mục Ôn lại bài làm sai.</p>${X.wr.map(([s,i,q])=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><small class="hint">${s=="L"?"Nghe":"Đọc"} câu ${i+1}</small><br><span class="kr">${q.rv}</span><br><small class="hint">Bạn chọn: ${X.ans[s][i]!=null?q.o[X.ans[s][i]]:"(bỏ trống)"} · Đáp án: ${q.o[q.a]}</small></div>`).join("")||"<p class='hint'>Không sai câu nào 🎉</p>"}</div><div class="row"><button class="btn" onclick="exstart(X.id,X.short)">Thi lại</button><button class="btn alt" onclick="revv()">Ôn bài sai</button></div><button class="btn alt" style="width:100%;margin-top:10px" onclick="practice()">Xong</button>`;scrollTo(0,0)}
const CUT={1:80,2:140,3:120,4:150,5:190,6:230};
function stat(m,ok){if(!m)return;S.st=S.st||{};const a=S.st[m]||[0,0];a[1]++;if(ok)a[0]++;S.st[m]=a;save()}
function acc(ms){let c=0,t=0;ms.forEach(m=>{const a=(S.st||{})[m];if(a){c+=a[0];t+=a[1]}});return t?Math.round(c/t*100):null}

function dleft(){const g=S.goal;if(!g||!g.date)return null;return Math.ceil((new Date(g.date+"T00:00:00")-new Date(new Date().toDateString()))/864e5)}
const dtxt=d=>d==null?"Chưa đặt ngày thi":d<0?"Ngày thi đã qua":d==0?"Hôm nay là ngày thi!":"Còn "+d+" ngày đến kỳ thi";

function dsrch(q){q=q.trim();if(!q)return[];const fq=fold(q),rq=fq.replace(/\s/g,""),hq=/[가-힣]/.test(q);if(!hq&&fq.length<2)return[];const out=[],viq=!hq&&/[^\x00-\x7f]/.test(q);
allw().forEach(w=>{let sc=99;const kr=w[0],rom=fold(w[2]).replace(/\s/g,""),vs=fold(w[1]).split(/[,;()]/).map(x=>x.trim());
if(hq){if(kr==q)sc=0;else if(kr.startsWith(q))sc=1;else if(/[요다죠까]$/.test(q)&&kr.endsWith("다")&&q.length>kr.length-1&&q.startsWith(kr.slice(0,-1)))sc=2;else if(kr.includes(q))sc=3;else if((w[3]||"").includes(q))sc=8}
else{if(vs.includes(fq))sc=3.5;else if(!viq&&rom&&rom==rq)sc=4;else if(!viq&&rom&&rom.startsWith(rq))sc=4.5;else if((" "+fold(w[1]).replace(/[,;()]/g," ")).includes(" "+fq))sc=6;else if(!viq&&rom&&rom.includes(rq)&&rq.length>=3)sc=7;else if(fq.length>=3&&fold(w[4]||"").includes(fq))sc=9}
if(sc<99)out.push([sc,w])});
out.sort((a,b)=>a[0]-b[0]||a[1][0].length-b[1][0].length);return out.slice(0,25).map(x=>x[1])}

function dcard(w,i){const t=DK.find(d=>d.id[0]=="t"&&d.w.some(x=>x[0]==w[0])),k=S.known[w[0]];return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><span class="kr" style="font-size:26px;font-weight:700;color:var(--p)">${w[0]}</span> <small class="hint">${w[2]||""}</small><div style="font-weight:700;margin-top:2px">${w[1]}</div></div><span class="chip">Cấp ${w[5]||"?"}</span></div>${t?`<small class="hint">${t.n}</small>`:""}${w[3]?`<div class="ex" style="margin-top:8px"><p class="kr" style="margin:0;font-weight:700">${w[3]}</p><small class="hint">${w[4]||""}</small></div>`:""}<div class="row" style="margin-top:10px"><button class="btn alt" onclick="say(DR[${i}][0])">🔊 Từ</button>${w[3]?`<button class="btn alt" onclick="say(DR[${i}][3],.8)">💬 Câu</button>`:""}<button class="btn ${k?"ok":"alt"}" onclick="dknow(${i},this)">${k?"✓ Đã nhớ":"Đã nhớ"}</button><button class="btn alt" onclick="dwrong(${i})">📌 Cần ôn</button></div></div>`}
