<style>
:root{color-scheme:light;--bg:#fff5f9;--card:#fff;--ink:#3a1830;--mute:#8a6a7e;--p:#ff4f9a;--p2:#ff8cc0;--soft:#ffe1ef;--ok:#14b87a;--no:#f0476b;--line:#ffd3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#24101c;--card:#33192a;--ink:#ffeaf4;--mute:#d3a5bf;--soft:#4a2038;--line:#5a2c47}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#24101c;--card:#33192a;--ink:#ffeaf4;--mute:#d3a5bf;--soft:#4a2038;--line:#5a2c47}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;min-height:100vh}
.kr{font-family:"Noto Sans KR","Be Vietnam Pro",sans-serif}
.app{max-width:560px;margin:0 auto;padding:18px 16px 170px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}h1 span{color:var(--p)}
.chip{background:var(--soft);color:var(--p);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.lv{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.lv button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.lv button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(255,79,154,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#ff4f9a,#ff9ccb);color:#fff;border:0;box-shadow:0 12px 28px rgba(255,79,154,.3)}
.hero h2{margin:0 0 4px;font-size:20px;font-weight:800}.hero p{margin:0 0 14px;opacity:.95}
.bar{height:10px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--p)}.stat small{color:var(--mute)}
.btn{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--p);color:#fff}
.btn.alt{background:var(--soft);color:var(--p)}.btn.w{background:#fff;color:var(--p)}.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}
.row{display:flex;gap:10px}.row>*{flex:1}
.flash{perspective:900px;height:230px;margin-bottom:14px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.f .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1.5px solid var(--line);padding:16px}
.face.b{transform:rotateY(180deg);background:linear-gradient(135deg,var(--soft),var(--card))}
.big{font-size:44px;font-weight:700;color:var(--p)}.mean{font-size:26px;font-weight:800}
.hint{color:var(--mute);font-size:13px}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;font:inherit;font-weight:600;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.q{font-size:34px;text-align:center;font-weight:700;margin:10px 0 18px;color:var(--p)}
.g h3{margin:0 0 4px;font-size:18px;color:var(--p)}.g p{margin:2px 0}.ex{background:var(--soft);border-radius:12px;padding:9px 12px;margin-top:8px}
.hg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hg button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 0;cursor:pointer;font:inherit}
.hg b{display:block;font-size:26px;color:var(--p)}.hg small{color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;font-weight:600;padding:6px 0;cursor:pointer;border-radius:12px}
nav button.on{color:var(--p);background:var(--soft)}nav button span{display:block;font-size:20px}
button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.flash{height:340px}.face.b{justify-content:flex-start;align-items:stretch;text-align:left;gap:10px;overflow:auto;padding:16px}.bk-h{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}.bk-h .mean{font-size:26px;line-height:1.25;text-align:center}.bk-h .chip{flex:none;font-size:12px}.bk-s{background:var(--soft);border-radius:14px;padding:10px 12px}.bk-l{display:block;font-size:11px;font-weight:700;color:var(--p);margin-bottom:4px}.bk-s p{margin:0;line-height:1.55}.bk-s .kr{font-size:15px}

function tip(){if(TM)return;const h=new Date().getHours(),g=h<11?"Chào buổi sáng! Hôm nay học gì nào? ☀️":h<18?"Chiều rồi, học chút cho tỉnh nào 🌼":"Tối rồi, học 10 phút rồi nghỉ nha 🌙";if(Math.random()<.5)return fact();if(tab=="home"&&Math.random()<.35)return cat(g);cat(rp((TIPS[tab]||[]).concat(EXTRA[tab]||[])))}
function cheer(ok){cat(ok?rp(CHEER):Math.random()<.4?rp(MEME):rp(OOPS))}
setInterval(()=>{if(S.mimi!==0&&!TM&&Math.random()<.7)(Math.random()<.65?fact():tip())},30000);
(function(){const c=$("cat");let d=null,mv=false,ox=0,oy=0;
function place(x,y){x=Math.max(0,Math.min(innerWidth-c.offsetWidth,x));y=Math.max(0,Math.min(innerHeight-c.offsetHeight,y));c.style.left=x+"px";c.style.top=y+"px";c.style.right="auto";c.style.bottom="auto";c.classList.toggle("dn",y<110);c.classList.toggle("lf",x<180)}
c.addEventListener("pointerdown",e=>{const r=c.getBoundingClientRect();d=[e.clientX,e.clientY];ox=e.clientX-r.left;oy=e.clientY-r.top;mv=false;c.setPointerCapture(e.pointerId)});
c.addEventListener("pointermove",e=>{if(!d)return;if(Math.abs(e.clientX-d[0])+Math.abs(e.clientY-d[1])>6)mv=true;if(mv)place(e.clientX-ox,e.clientY-oy)});
c.addEventListener("pointerup",()=>{if(!d)return;d=null;if(mv){const r=c.getBoundingClientRect();S.cat=[r.left,r.top];save()}else tip()});
if(S.cat)place(S.cat[0],S.cat[1]);
addEventListener("resize",()=>{const r=c.getBoundingClientRect();if(c.style.left)place(r.left,r.top)})})();
bd();render();
</script></body></html>
